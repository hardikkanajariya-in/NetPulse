name: Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish artifact
        run: dotnet publish --configuration Release --runtime win-x64 --self-contained false -p:PublishSingleFile=true -o publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: netpulse-win-x64
          path: publish/
