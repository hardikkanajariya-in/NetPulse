name: Release

on:
  push:
    tags:
      - v*

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Publish single-file build
        run: dotnet publish --configuration Release --runtime win-x64 --self-contained false -p:PublishSingleFile=true -o publish

      - name: Create release archive
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath NetPulse-${{ github.ref_name }}-win-x64.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: NetPulse-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
